name: "Torrent Crawler & Supabase Indexer"

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      crawlers:
        description: "Target crawlers to execute (all, pelispanda, leech1337x, torrentgalaxy, yts, eztv, divxtotal)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - pelispanda
          - leech1337x
          - torrentgalaxy
          - yts
          - eztv
          - divxtotal
      dry_run:
        description: "Dry run mode (crawl and validate without writing to Supabase)"
        required: false
        default: false
        type: boolean
      max_pages:
        description: "Maximum pages/catalogs to traverse per target site"
        required: false
        default: "3"
        type: string

concurrency:
  group: torrent-crawler-job
  cancel-in-progress: false

jobs:
  crawl-and-sync:
    name: "Crawl, Filter Spanish & Supabase Upsert"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js LTS (v20)"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install Node Dependencies"
        run: npm ci

      - name: "Cache Playwright Chromium Binaries"
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: "Install Playwright Chromium & System Dependencies"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: "Build TypeScript to JavaScript"
        run: npm run build

      - name: "Run Asynchronous Crawler and Database Upsert"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_CRAWLERS: ${{ github.event.inputs.crawlers || 'all' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
          NODE_ENV: "production"
          REQUEST_TIMEOUT_MS: "25000"
          CRAWLER_CONCURRENCY: "3"
        run: npm start
