name: "Torrent Crawler & Supabase Indexer"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      crawlers:
        description: "Crawler a ejecutar (all incluye las 12 fuentes)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - pelispanda
          - leech1337x
          - torrentgalaxy
          - yts
          - eztv
          - thepiratebay
          - mejortorrent
          - elitetorrent
          - limetorrents
          - nyaa
          - wolftorrent
          - sinsitio
      dry_run:
        description: "Dry run mode (crawl and validate without writing to Supabase)"
        required: false
        default: false
        type: boolean
      max_pages:
        description: "Maximum pages/catalogs to traverse per target site"
        required: false
        default: "3"
        type: string

concurrency:
  group: torrent-crawler-job
  cancel-in-progress: false

jobs:
  crawl-and-sync:
    name: "Crawl, Filter Spanish/English & Supabase Upsert"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Normalize Project Directory Structure"
        run: |
          if [ ! -f "package.json" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/.*" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Project found in subfolder: $SUBDIR. Moving files to root..."
              shopt -s dotglob
              mv "$SUBDIR"/* .
            fi
          fi
          echo "Repository root contents:"
          ls -la

      - name: "Set up Node.js LTS"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Install Node Dependencies"
        run: npm ci

      - name: "Cache Playwright Chromium Binaries"
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: "Install Playwright Chromium & System Dependencies"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: "Build TypeScript to JavaScript"
        run: npm run build

      - name: "Offline crawler regression tests"
        run: npm test

      - name: "Run Asynchronous Crawler and Database Upsert"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_CRAWLERS: ${{ github.event.inputs.crawlers || 'all' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
          NODE_ENV: "production"
          REQUEST_TIMEOUT_MS: "25000"
          CRAWLER_CONCURRENCY: "3"
        run: npm start
