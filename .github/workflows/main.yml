name: "Torrent Crawler & Supabase Indexer"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      crawlers:
        description: "Fuentes en español + grandes globales, una fuente o todas"
        required: false
        default: "priority"
        type: choice
        options:
          - priority
          - all
          - pelispanda
          - leech1337x
          - torrentgalaxy
          - yts
          - eztv
          - thepiratebay
          - mejortorrent
          - elitetorrent
          - limetorrents
          - nyaa
          - wolftorrent
          - sinsitio
          - dontorrent
          - rarbg
          - magnetdl
          - tokyotosho
          - grantorrent
          - rutracker
          - t0rrenta
          - estrenostorrent
      dry_run:
        description: "Dry run mode (crawl and validate without writing to Supabase)"
        required: false
        default: false
        type: boolean
      max_pages:
        description: "Maximum pages/catalogs to traverse per target site"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: torrent-crawler-job
  cancel-in-progress: false

jobs:
  crawl-and-sync:
    name: "Crawl, Filter Spanish/English & Supabase Upsert"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: workspace-01a0cc85-8346-76ce-b6ba-2949a774c63c

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js LTS"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace-01a0cc85-8346-76ce-b6ba-2949a774c63c/package-lock.json

      - name: "Install Node Dependencies"
        run: npm ci

      - name: "Cache Playwright Chromium Binaries"
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('workspace-01a0cc85-8346-76ce-b6ba-2949a774c63c/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # The apt packages are NOT part of the cache above: skipping this step on a
      # cache hit left the restored Chromium without libnss3/libatk and every
      # Cloudflare solve failed with "Host system is missing dependencies".
      - name: "Install Playwright System Dependencies"
        run: npx playwright install-deps chromium

      - name: "Download Playwright Chromium"
        run: npx playwright install chromium

      - name: "Type check"
        run: npm run lint

      - name: "Build TypeScript to JavaScript"
        run: npm run build

      - name: "Offline crawler regression tests"
        run: npm test

      - name: "Run Asynchronous Crawler and Database Upsert"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_CRAWLERS: ${{ github.event.inputs.crawlers || 'priority' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
          NODE_ENV: "production"
          REQUEST_TIMEOUT_MS: "25000"
          CRAWLER_CONCURRENCY: "3"
          LOG_LEVEL: "info"
          # Mirror probing is hedged: a pool of dead domains costs ~one timeout
          # instead of candidates x timeout.
          MIRROR_PROBE_STAGGER_MS: "700"
          # Courtesy delay between requests of a single crawler.
          CRAWLER_REQUEST_DELAY_MS: "150"
          # Cooperative loop budget; in-flight requests may exceed it. The job timeout is the hard limit.
          CRAWLER_TIME_BUDGET_MS: "420000"
          # RuTracker needs an account: without these secrets it fails with an
          # actionable auth error, so add them or drop "rutracker" from the list.
          RUTRACKER_USERNAME: ${{ secrets.RUTRACKER_USERNAME }}
          RUTRACKER_PASSWORD: ${{ secrets.RUTRACKER_PASSWORD }}
          RUTRACKER_COOKIE_JSON: ${{ secrets.RUTRACKER_COOKIE_JSON }}
        run: npm start
