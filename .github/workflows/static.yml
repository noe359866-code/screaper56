name: "Peerflix Ingest – fetch & upsert"
run-name: >-
  ${{ github.event_name == 'schedule' && 'Ingesta programada' ||
      (inputs.issue != '' && format('Ingesta del Issue #{0}', inputs.issue)) ||
      'Ingesta manual' }}

on:
  schedule:
    - cron: "0 4 */1 * *"   # diario 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (consulta proveedores pero NO escribe en Supabase)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      rotate_watchlist:
        description: "Actualizar watchlist.txt con títulos nuevos y eliminar los anteriores"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      follow_series:
        description: "Seguir una sola serie hasta terminarla (1 = 1 serie + películas, only = solo esa serie sin películas, 0 = varias a la vez)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "only"
          - "0"
      series_id:
        description: "IMDb ID de la serie a seguir hasta terminarla (ej. tt0411008; vacío = continúa la serie en curso)"
        required: false
        default: ""
        type: string
      batch_size:
        description: "Cantidad de títulos nuevos a cargar en watchlist.txt"
        required: false
        default: "10"
        type: string
      genres:
        description: "Géneros con hueco reservado en cada lote (anime, documentales, terror, Sci-Fi…; 0 = ninguno)"
        required: false
        default: "anime,documentales"
        type: string
      providers:
        description: "Addons Stremio (slugs separados por comas)"
        required: false
        default: "peerflix,torrentsdb,torrentio,piratebay,ytztvio,torrentclaw,aniscraper,stremthru,brazuca"
        type: string
      issue:
        description: "Nº del Issue que pidió la ingesta (lo rellena issue-ingest.yml; vacío = ninguno)"
        required: false
        default: ""
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write     # responder en el Issue de ingesta (ingesta sin token)

concurrency:
  group: peerflix-static
  cancel-in-progress: false

jobs:
  ingest:
    name: "Fetch Stremio streams & UPSERT Supabase"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: "Marca de inicio"
        run: echo "JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: "Install dependencies"
        run: npm ci

      # Antes de la ingesta: así el report sabe la URL pública del dashboard.
      - id: pages
        name: "Setup Pages"
        uses: actions/configure-pages@v5
        continue-on-error: true   # la ingesta no depende de Pages

      - name: "Run fetch & upsert"
        env:
          FETCH_CONCURRENCY: "4"
          FETCH_TIMEOUT_MS: "20000"
          # Trackers por magnet (solo los mejores de ngosang/trackerslist)
          MAX_TRACKERS: "10"
          PEERFLIX_BASE_URL: "https://peerflix.mov"
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          # Opcionales: sin ellos todo funciona (Cinemeta no necesita API key;
          # con TMDB_API_KEY y OMDB_API_KEY se descubren títulos en TMDB, se
          # guarda tmdb_id en Supabase y se enriquecen metadatos con OMDb).
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          AUTO_WATCHLIST: ${{ inputs.issue != '' && '0' || inputs.rotate_watchlist || '1' }}
          WATCHLIST_BATCH_SIZE: ${{ inputs.batch_size || '10' }}
          FOLLOW_SERIES: ${{ inputs.issue != '' && '0' || inputs.follow_series || '1' }}
          SERIES_ID: ${{ inputs.series_id || '' }}
          # Serie larga: máx. episodios expandidos por corrida; la próxima
          # ejecución reanuda donde quedó (0 = sin límite).
          MAX_EPISODES_PER_RUN: "60"
          DISCOVERY_GENRES: ${{ inputs.genres || 'anime,documentales' }}
          PROVIDERS: ${{ inputs.providers || 'peerflix,torrentsdb,torrentio,piratebay,ytztvio,torrentclaw,aniscraper,stremthru,brazuca' }}
        run: node src/fetch.mjs

      - name: "Resumen de la ejecución"
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node src/summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: "Commit generated watchlist.txt & public/ back to repo"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.txt public/
          if git diff --cached --quiet; then
            echo "No hay cambios en watchlist.txt ni en public/."
            exit 0
          fi
          git commit -m "chore(data): refresh watchlist & streams $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Otro commit (p. ej. watchlist.txt desde un Issue) puede haber llegado mientras tanto.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rechazado (intento ${attempt}); rebase y reintento…"
            git pull --rebase
            sleep $((attempt * 3))
          done
          exit 1

      - name: "Upload Pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        name: "Deploy to GitHub Pages"
        uses: actions/deploy-pages@v4

      # Publicamos el report aunque falle Supabase, pero el job no debe quedar
      # en verde ni cerrar el Issue como completado si la escritura falló.
      - name: "Verificar resultado de Supabase"
        run: node src/check-db.mjs

      - name: "Responder en el Issue de ingesta"
        if: always() && inputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url || steps.pages.outputs.base_url }}
          SUMMARY_PATH: ${{ runner.temp }}/issue-summary.md
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "issue no numérico: se ignora"; exit 0; }
          MAX_ROWS=60 node src/summary.mjs > "$SUMMARY_PATH"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$SUMMARY_PATH"
          if [[ "$JOB_STATUS" == "success" ]]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
