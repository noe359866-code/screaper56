name: "Peerflix Ingest – fetch & upsert"

on:
  schedule:
    - cron: "0 4 */1 * *"   # diario 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (consulta proveedores pero NO escribe en Supabase)"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      providers:
        description: "Addons Stremio (slugs separados por comas)"
        required: false
        default: "peerflix,torrentsdb,torrentio,piratebay,ytztvio"
        type: string
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: peerflix-static
  cancel-in-progress: false

jobs:
  ingest:
    name: "Fetch Stremio streams & UPSERT Supabase"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: "Install dependencies"
        run: npm ci

      - name: "Run fetch & upsert"
        env:
          FETCH_CONCURRENCY: "4"
          FETCH_TIMEOUT_MS: "20000"
          PEERFLIX_BASE_URL: "https://peerflix.mov"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          PROVIDERS: ${{ github.event.inputs.providers || 'peerflix,torrentsdb,torrentio,piratebay,ytztvio' }}
        run: node src/fetch.mjs

      - name: "Commit generated public/ back to repo"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "No hay cambios en public/."
          else
            git commit -m "chore(data): refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: "Setup Pages"
        uses: actions/configure-pages@v5

      - name: "Upload Pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        name: "Deploy to GitHub Pages"
        uses: actions/deploy-pages@v4
